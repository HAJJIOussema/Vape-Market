openapi: 3.1.0
info:
  title: VAPE MARKET API
  version: 1.0.0
  description: |
    Contrat REST version 1 de VAPE MARKET. Les produits et la vente restent
    soumis aux validations réglementaires applicables avant toute mise en
    production.
  license:
    name: Proprietary
servers:
  - url: /api/v1
    description: API v1
tags:
  - name: Auth
  - name: Profile
  - name: Addresses
  - name: Categories
  - name: Brands
  - name: Products
  - name: Cart
  - name: Orders
  - name: Admin
security:
  - bearerAuth: []
paths:
  /auth/signup:
    post:
      tags: [Auth]
      security: []
      summary: Create a customer account
      operationId: signUp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/ConflictError' }
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Authenticate a user
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
  /auth/refresh:
    post:
      tags: [Auth]
      security: []
      summary: Refresh an access token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Refreshed session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401': { $ref: '#/components/responses/UnauthorizedError' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: End the current session
      operationId: logout
      responses:
        '204': { description: Session ended }
        '401': { $ref: '#/components/responses/UnauthorizedError' }

  /profile:
    get:
      tags: [Profile]
      summary: Get the current profile
      operationId: getProfile
      responses:
        '200':
          description: Current profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    patch:
      tags: [Profile]
      summary: Update the current profile
      operationId: updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }

  /addresses:
    get:
      tags: [Addresses]
      summary: List the current user's addresses
      operationId: listAddresses
      responses:
        '200':
          description: Address list
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Address' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
    post:
      tags: [Addresses]
      summary: Create an address
      operationId: createAddress
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressRequest' }
      responses:
        '201':
          description: Address created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Address' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
  /addresses/{addressId}:
    parameters:
      - $ref: '#/components/parameters/AddressId'
    get:
      tags: [Addresses]
      summary: Get an address
      operationId: getAddress
      responses:
        '200':
          description: Address
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Address' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    patch:
      tags: [Addresses]
      summary: Update an address
      operationId: updateAddress
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressRequest' }
      responses:
        '200':
          description: Updated address
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Address' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    delete:
      tags: [Addresses]
      summary: Delete an address
      operationId: deleteAddress
      responses:
        '204': { description: Address deleted }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /categories:
    get:
      tags: [Categories]
      security: []
      summary: List active categories
      operationId: listCategories
      parameters:
        - $ref: '#/components/parameters/ParentId'
        - $ref: '#/components/parameters/Active'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryList' }
  /categories/{categoryId}:
    parameters:
      - $ref: '#/components/parameters/CategoryId'
    get:
      tags: [Categories]
      security: []
      summary: Get a category
      operationId: getCategory
      responses:
        '200':
          description: Category
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /brands:
    get:
      tags: [Brands]
      security: []
      summary: List active brands
      operationId: listBrands
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Brands
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrandList' }
  /brands/{brandId}:
    parameters:
      - $ref: '#/components/parameters/BrandId'
    get:
      tags: [Brands]
      security: []
      summary: Get a brand
      operationId: getBrand
      responses:
        '200':
          description: Brand
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Brand' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /products:
    get:
      tags: [Products]
      security: []
      summary: List active products
      operationId: listProducts
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/CategoryIdQuery'
        - $ref: '#/components/parameters/BrandIdQuery'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/InStock'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Products
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductList' }
  /products/{productId}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      tags: [Products]
      security: []
      summary: Get a product and its variants
      operationId: getProduct
      responses:
        '200':
          description: Product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /products/slug/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
    get:
      tags: [Products]
      security: []
      summary: Get a product by slug
      operationId: getProductBySlug
      responses:
        '200':
          description: Product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /products/{productId}/variants:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      tags: [Products]
      security: []
      summary: List variants of a product
      operationId: listProductVariants
      responses:
        '200':
          description: Product variants
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ProductVariant' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /cart:
    get:
      tags: [Cart]
      summary: Get the current cart
      operationId: getCart
      responses:
        '200':
          description: Cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
    delete:
      tags: [Cart]
      summary: Empty the current cart
      operationId: clearCart
      responses:
        '204': { description: Cart emptied }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
  /cart/items:
    post:
      tags: [Cart]
      summary: Add or replace a cart line
      operationId: addCartItem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CartItemRequest' }
      responses:
        '201':
          description: Cart line added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '409': { $ref: '#/components/responses/ConflictError' }
  /cart/items/{variantId}:
    parameters:
      - $ref: '#/components/parameters/VariantId'
    patch:
      tags: [Cart]
      summary: Change a cart line quantity
      operationId: updateCartItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: integer, minimum: 1, maximum: 999 }
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    delete:
      tags: [Cart]
      summary: Remove a cart line
      operationId: removeCartItem
      responses:
        '204': { description: Cart line removed }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /orders:
    get:
      tags: [Orders]
      summary: List the current user's orders
      operationId: listOrders
      parameters:
        - $ref: '#/components/parameters/OrderStatus'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Orders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderList' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
    post:
      tags: [Orders]
      summary: Create an authenticated cash-on-delivery order
      operationId: createOrder
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderRequest' }
      responses:
        '201':
          description: Order created and stock reserved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '422': { $ref: '#/components/responses/BusinessError' }
  /orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [Orders]
      summary: Get an order
      operationId: getOrder
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /orders/{orderId}/cancel:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      tags: [Orders]
      summary: Cancel an order and release reserved stock
      operationId: cancelOrder
      responses:
        '200':
          description: Cancelled order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }

  /admin/orders:
    get:
      tags: [Admin]
      summary: List all orders
      description: Requires admin or super_admin.
      operationId: adminListOrders
      parameters:
        - $ref: '#/components/parameters/OrderStatus'
        - $ref: '#/components/parameters/ProfileId'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Orders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderList' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
  /admin/orders/{orderId}/ship:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      tags: [Admin]
      summary: Ship an order
      description: Requires stock_manager, admin, or super_admin.
      operationId: shipOrder
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                carrier: { type: string, maxLength: 120 }
                tracking_number: { type: string, maxLength: 160 }
      responses:
        '200':
          description: Shipped order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '409': { $ref: '#/components/responses/ConflictError' }
  /admin/inventory:
    get:
      tags: [Admin]
      summary: List inventory
      description: Requires stock_manager, admin, or super_admin.
      operationId: listInventory
      parameters:
        - $ref: '#/components/parameters/InStock'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Inventory
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryList' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
  /admin/inventory/{variantId}/adjust:
    parameters:
      - $ref: '#/components/parameters/VariantId'
    post:
      tags: [Admin]
      summary: Adjust inventory
      description: Requires stock_manager, admin, or super_admin. Creates an immutable movement.
      operationId: adjustInventory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [delta, reason]
              properties:
                delta:
                  oneOf:
                    - { type: integer, maximum: -1 }
                    - { type: integer, minimum: 1 }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: Updated inventory
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Inventory' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '409': { $ref: '#/components/responses/ConflictError' }
  /admin/inventory-movements:
    get:
      tags: [Admin]
      summary: List inventory movements
      description: Requires stock_manager, admin, or super_admin.
      operationId: listInventoryMovements
      parameters:
        - $ref: '#/components/parameters/VariantIdQuery'
        - $ref: '#/components/parameters/MovementType'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Inventory movements
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryMovementList' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
  /admin/audit-logs:
    get:
      tags: [Admin]
      summary: List audit logs
      description: Requires super_admin only.
      operationId: listAuditLogs
      parameters:
        - $ref: '#/components/parameters/Action'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Audit logs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditLogList' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Auth access token.
  parameters:
    AddressId: { name: addressId, in: path, required: true, schema: { $ref: '#/components/schemas/UUID' } }
    CategoryId: { name: categoryId, in: path, required: true, schema: { $ref: '#/components/schemas/UUID' } }
    BrandId: { name: brandId, in: path, required: true, schema: { $ref: '#/components/schemas/UUID' } }
    ProductId: { name: productId, in: path, required: true, schema: { $ref: '#/components/schemas/UUID' } }
    VariantId: { name: variantId, in: path, required: true, schema: { $ref: '#/components/schemas/UUID' } }
    OrderId: { name: orderId, in: path, required: true, schema: { $ref: '#/components/schemas/UUID' } }
    ProfileId: { name: profile_id, in: query, schema: { $ref: '#/components/schemas/UUID' } }
    ParentId: { name: parent_id, in: query, schema: { $ref: '#/components/schemas/UUID' } }
    CategoryIdQuery: { name: category_id, in: query, schema: { $ref: '#/components/schemas/UUID' } }
    BrandIdQuery: { name: brand_id, in: query, schema: { $ref: '#/components/schemas/UUID' } }
    VariantIdQuery: { name: variant_id, in: query, schema: { $ref: '#/components/schemas/UUID' } }
    Search: { name: q, in: query, description: Case-insensitive search text., schema: { type: string, minLength: 1, maxLength: 120 } }
    Active: { name: active, in: query, schema: { type: boolean, default: true } }
    InStock: { name: in_stock, in: query, schema: { type: boolean } }
    Status: { name: status, in: query, schema: { $ref: '#/components/schemas/ProductStatus' } }
    OrderStatus: { name: status, in: query, schema: { $ref: '#/components/schemas/OrderStatus' } }
    MovementType: { name: movement_type, in: query, schema: { $ref: '#/components/schemas/MovementType' } }
    Action: { name: action, in: query, schema: { type: string, maxLength: 120 } }
    Sort:
      name: sort
      in: query
      description: Comma-separated fields. Prefix a field with '-' for descending order.
      schema: { type: string, example: -created_at }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique request key retained for 24 hours.
      schema: { type: string, minLength: 16, maxLength: 255 }
  responses:
    ValidationError:
      description: Invalid request
      content:
        application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } }
    UnauthorizedError:
      description: Missing or invalid JWT
      content:
        application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } }
    ForbiddenError:
      description: Insufficient role
      content:
        application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } }
    NotFoundError:
      description: Resource not found
      content:
        application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } }
    ConflictError:
      description: Conflict or duplicate operation
      content:
        application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } }
    BusinessError:
      description: Business rule violation
      content:
        application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } }
  schemas:
    UUID:
      type: string
      format: uuid
    Timestamp:
      type: string
      format: date-time
    UserRole:
      type: string
      enum: [customer, stock_manager, admin, super_admin]
    ProductStatus:
      type: string
      enum: [draft, active, inactive, archived]
    OrderStatus:
      type: string
      enum: [pending, confirmed, processing, shipped, delivered, cancelled, returned, refunded]
    PaymentStatus:
      type: string
      enum: [pending, paid, failed, refunded]
    MovementType:
      type: string
      enum: [restock, sale, adjustment, reserve, release, return]
    AddressType:
      type: string
      enum: [home, work, other]
    Pagination:
      type: object
      required: [page, page_size, total, total_pages]
      properties:
        page: { type: integer, minimum: 1, example: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100, example: 20 }
        total: { type: integer, minimum: 0, example: 42 }
        total_pages: { type: integer, minimum: 0, example: 3 }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: VALIDATION_ERROR }
        message: { type: string, example: The request is invalid. }
        details: { type: object, additionalProperties: true }
        request_id: { type: string, example: req_01HXYZ }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { $ref: '#/components/schemas/Error' }
    AuthTokens:
      type: object
      required: [access_token, refresh_token, expires_in, token_type]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer, example: 3600 }
        token_type: { type: string, example: Bearer }
    AuthResponse:
      type: object
      required: [user, tokens]
      properties:
        user: { $ref: '#/components/schemas/AuthUser' }
        tokens: { $ref: '#/components/schemas/AuthTokens' }
    AuthUser:
      type: object
      required: [id, email]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/UserRole' }
    SignUpRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8, maxLength: 128 }
        full_name: { type: string, minLength: 1, maxLength: 160 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    RefreshTokenRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string, minLength: 1 }
    Profile:
      type: object
      required: [id, role, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        role: { $ref: '#/components/schemas/UserRole' }
        full_name: { type: [string, 'null'], maxLength: 160 }
        phone: { type: [string, 'null'], maxLength: 40 }
        anonymized_at: { type: [string, 'null'], format: date-time }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    ProfileUpdateRequest:
      type: object
      minProperties: 1
      properties:
        full_name: { type: [string, 'null'], maxLength: 160 }
        phone: { type: [string, 'null'], maxLength: 40 }
    Address:
      type: object
      required: [id, address_type, label, recipient_name, phone, governorate, city, address_line, is_default]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        address_type: { $ref: '#/components/schemas/AddressType' }
        label: { type: string, minLength: 1, maxLength: 80 }
        recipient_name: { type: string, minLength: 1, maxLength: 160 }
        phone: { type: string, minLength: 1, maxLength: 40 }
        governorate: { type: string, minLength: 1, maxLength: 100 }
        city: { type: string, minLength: 1, maxLength: 100 }
        address_line: { type: string, minLength: 1, maxLength: 255 }
        postal_code: { type: [string, 'null'], maxLength: 20 }
        is_default: { type: boolean }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    AddressRequest:
      type: object
      required: [address_type, label, recipient_name, phone, governorate, city, address_line]
      properties:
        address_type: { $ref: '#/components/schemas/AddressType' }
        label: { type: string, minLength: 1, maxLength: 80 }
        recipient_name: { type: string, minLength: 1, maxLength: 160 }
        phone: { type: string, minLength: 1, maxLength: 40 }
        governorate: { type: string, minLength: 1, maxLength: 100 }
        city: { type: string, minLength: 1, maxLength: 100 }
        address_line: { type: string, minLength: 1, maxLength: 255 }
        postal_code: { type: string, maxLength: 20 }
        is_default: { type: boolean, default: false }
    Category:
      type: object
      required: [id, name, slug, is_active, sort_order]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        parent_id: { type: [string, 'null'], format: uuid }
        name: { type: string, maxLength: 120 }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        description: { type: [string, 'null'] }
        image_path: { type: [string, 'null'] }
        is_active: { type: boolean }
        sort_order: { type: integer, minimum: 0 }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    CategoryList:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Category' } }
    Brand:
      type: object
      required: [id, name, slug, is_active]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        name: { type: string, maxLength: 120 }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        description: { type: [string, 'null'] }
        image_path: { type: [string, 'null'] }
        is_active: { type: boolean }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    BrandList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Brand' } }
        meta: { $ref: '#/components/schemas/Pagination' }
    ProductVariant:
      type: object
      required: [id, product_id, sku, name, attributes, price_tnd, is_default, status, in_stock]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        product_id: { $ref: '#/components/schemas/UUID' }
        sku: { type: string, maxLength: 100 }
        name: { type: string, maxLength: 160 }
        attributes: { type: object, additionalProperties: true }
        price_tnd: { type: number, format: double, minimum: 0, example: 29.9 }
        is_default: { type: boolean }
        status: { $ref: '#/components/schemas/ProductStatus' }
        in_stock: { type: boolean, description: Never exposes exact quantities. }
    Product:
      type: object
      required: [id, category_id, brand_id, name, slug, status, variants]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        category_id: { $ref: '#/components/schemas/UUID' }
        brand_id: { $ref: '#/components/schemas/UUID' }
        name: { type: string, maxLength: 200 }
        slug: { type: string }
        description: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/ProductStatus' }
        image_paths: { type: array, items: { type: string } }
        variants: { type: array, items: { $ref: '#/components/schemas/ProductVariant' } }
    ProductList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Product' } }
        meta: { $ref: '#/components/schemas/Pagination' }
    CartItem:
      type: object
      required: [variant_id, quantity]
      properties:
        variant_id: { $ref: '#/components/schemas/UUID' }
        quantity: { type: integer, minimum: 1 }
        variant: { $ref: '#/components/schemas/ProductVariant' }
    Cart:
      type: object
      required: [id, status, items]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        status: { type: string, enum: [active, converted, abandoned] }
        items: { type: array, items: { $ref: '#/components/schemas/CartItem' } }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    CartItemRequest:
      type: object
      required: [variant_id, quantity]
      properties:
        variant_id: { $ref: '#/components/schemas/UUID' }
        quantity: { type: integer, minimum: 1, maximum: 999 }
    OrderItem:
      type: object
      required: [id, product_name_snapshot, variant_name_snapshot, sku_snapshot, unit_price_tnd, quantity, line_total_tnd]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        variant_id: { type: [string, 'null'], format: uuid }
        product_name_snapshot: { type: string }
        variant_name_snapshot: { type: string }
        sku_snapshot: { type: string }
        unit_price_tnd: { type: number, format: double, minimum: 0 }
        quantity: { type: integer, minimum: 1 }
        line_total_tnd: { type: number, format: double, minimum: 0 }
    Order:
      type: object
      required: [id, order_number, profile_id, status, payment_method, payment_status, subtotal_tnd, shipping_cost_tnd, total_tnd, currency, items, created_at]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        order_number: { type: string, example: VM-A1B2C3D4E5F6 }
        profile_id: { $ref: '#/components/schemas/UUID' }
        customer_email: { type: string, format: email }
        customer_phone: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        payment_method: { type: string, enum: [cash_on_delivery] }
        payment_status: { $ref: '#/components/schemas/PaymentStatus' }
        subtotal_tnd: { type: number, format: double, minimum: 0 }
        shipping_cost_tnd: { type: number, format: double, minimum: 0 }
        total_tnd: { type: number, format: double, minimum: 0 }
        currency: { type: string, enum: [TND] }
        carrier: { type: [string, 'null'] }
        tracking_number: { type: [string, 'null'] }
        shipping_address_snapshot: { type: object, additionalProperties: true }
        items: { type: array, items: { $ref: '#/components/schemas/OrderItem' } }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    CreateOrderRequest:
      type: object
      required: [items, customer_email, customer_phone, shipping_address]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [variant_id, quantity]
            properties:
              variant_id: { $ref: '#/components/schemas/UUID' }
              quantity: { type: integer, minimum: 1, maximum: 999 }
        customer_email: { type: string, format: email }
        customer_phone: { type: string, minLength: 1, maxLength: 40 }
        shipping_address: { type: object, additionalProperties: true, minProperties: 1 }
        shipping_cost_tnd: { type: number, format: double, minimum: 0, default: 0 }
    OrderList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Order' } }
        meta: { $ref: '#/components/schemas/Pagination' }
    Inventory:
      type: object
      required: [variant_id, on_hand, reserved]
      properties:
        variant_id: { $ref: '#/components/schemas/UUID' }
