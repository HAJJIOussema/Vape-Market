        reserved: { type: integer, minimum: 0 }
        available: { type: integer, minimum: 0 }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    InventoryList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Inventory' } }
        meta: { $ref: '#/components/schemas/Pagination' }
    InventoryMovement:
      type: object
      required: [id, variant_id, movement_type, quantity_before, quantity_change, quantity_after, reserved_before, reserved_change, reserved_after, reason, created_at]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        variant_id: { $ref: '#/components/schemas/UUID' }
        order_id: { type: [string, 'null'], format: uuid }
        actor_id: { type: [string, 'null'], format: uuid }
        movement_type: { $ref: '#/components/schemas/MovementType' }
        quantity_before: { type: integer, minimum: 0 }
        quantity_change: { type: integer }
        quantity_after: { type: integer, minimum: 0 }
        reserved_before: { type: integer, minimum: 0 }
        reserved_change: { type: integer }
        reserved_after: { type: integer, minimum: 0 }
        reason: { type: string }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    InventoryMovementList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/InventoryMovement' } }
        meta: { $ref: '#/components/schemas/Pagination' }
    AuditLog:
      type: object
      required: [id, action, resource_type, metadata, created_at]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        user_id: { type: [string, 'null'], format: uuid }
        request_id: { type: [string, 'null'] }
        ip_address: { type: [string, 'null'] }
        user_agent: { type: [string, 'null'] }
        action: { type: string }
        resource_type: { type: string }
        resource_id: { type: [string, 'null'], format: uuid }
        metadata: { type: object, additionalProperties: true }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    AuditLogList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/AuditLog' } }
        meta: { $ref: '#/components/schemas/Pagination' }
