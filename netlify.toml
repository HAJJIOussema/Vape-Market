# Netlify: the site is the Vite app in frontend/ (static build, no server).
# Set VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY in
# Site configuration > Environment variables, then redeploy.

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: every route (/products/…, /admin, /suivi-commande…)
# is served by index.html and handled by React Router.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
